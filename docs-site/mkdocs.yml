site_name: DevRAG-2026
site_description: A production-grade RAG system over the latest AI/ML engineering knowledge.
site_url: https://<user>.github.io/DevRAG-2026/
repo_url: https://github.com/<user>/DevRAG-2026
repo_name: <user>/DevRAG-2026

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mkdocstrings

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Training: training.md
  - Results: results.md
  - Deployment: deployment.md
  - Case study: blog-post.md
  - Reproducibility: reproducibility.md
  - API reference: api.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/<user>/DevRAG-2026
    - icon: fontawesome/brands/huggingface
      link: https://huggingface.co/<user>/devrag-2026