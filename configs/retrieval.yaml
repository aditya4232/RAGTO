retrieval:
  bm25:
    enabled: true
    k1: 1.5
    b: 0.75
  dense:
    enabled: true
    model: Qwen/Qwen3-Embedding-0.6B
    lora_adapter: null
    normalize: true
    index_type: hnsw
    hnsw_m: 32
    hnsw_ef_construction: 200
  fusion:
    method: rrf
    rrf_k: 60
  reranker:
    enabled: true
    model: BAAI/bge-reranker-v2.5-gemma2-lightweight
    top_k: 8
  query_rewrite:
    multi_query: true
    hyde: true
    num_variants: 3
  final_top_k: 8

llm:
  backend: ollama
  model: qwen3:8b
  temperature: 0.2
  max_tokens: 1024
  system_prompt_file: configs/system_prompt.txt

indexing:
  output_dir: data/indexes