training:
  output_dir: data/models/devrag-embedding-2026
  base_model: Qwen/Qwen3-Embedding-0.6B
  loss: info_nce
  temperature: 0.05
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  optimization:
    batch_size: 32
    eval_batch_size: 64
    epochs: 1
    lr: 2e-4
    weight_decay: 0.01
    warmup_ratio: 0.05
    grad_accum: 4
    fp16: true
    bf16: false
    max_seq_length: 512
  data:
    train_file: data/processed/pairs_train.jsonl
    eval_file: data/processed/pairs_eval.jsonl
    max_pairs: 50000
  push_to_hub:
    enabled: false
    repo_id: <user>/devrag-embedding-2026
    private: false