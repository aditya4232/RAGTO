[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devrag"
version = "0.1.0"
description = "DevRAG-2026: a production-grade RAG system over the latest AI/ML engineering knowledge, with a fine-tuned embedding model, automated benchmark dashboard, and live Gradio demo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DevRAG Contributors" }]
keywords = ["rag", "retrieval-augmented-generation", "llm", "huggingface", "transformers", "fine-tuning", "2026"]

dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "rich>=13.7",
  "typer>=0.12",
  "httpx>=0.27",
  "tenacity>=8.2",
  "rank-bm25>=0.2.2",
  "faiss-cpu>=1.8.0",
  "sentence-transformers>=2.7",
  "transformers>=4.43",
  "peft>=0.11",
  "datasets>=2.20",
  "accelerate>=0.33",
  "bitsandbytes>=0.43",
  "chonkie>=1.0",
  "trafilatura>=1.12",
  "markdownify>=0.12",
  "feedparser>=6.0.11",
  "arxiv>=2.1",
  "huggingface-hub>=0.24",
  "ollama>=0.3",
  "openai>=1.40",
  "gradio>=4.40",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-dotenv>=1.0",
  "matplotlib>=3.9",
  "plotly>=5.22",
  "kaleido>=0.2.1",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "ipykernel>=6.29",
  "nbconvert>=7.16",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mike>=2.1",
]
gpu = ["faiss-gpu>=1.8.0", "torch>=2.3"]

[project.scripts]
devrag = "devrag.cli:main"

[project.urls]
Homepage = "https://github.com/<user>/DevRAG-2026"
Documentation = "https://<user>.github.io/DevRAG-2026/"
Space = "https://huggingface.co/spaces/<user>/devrag-2026"
Model = "https://huggingface.co/<user>/devrag-embedding-2026"
Dataset = "https://huggingface.co/datasets/<user>/devrag-corpus-2026"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"